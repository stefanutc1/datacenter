version: '3.8'

services:
  homepage:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/stefannut/homelab-homepage:latest
    container_name: homelab-homepage
    restart: unless-stopped
    ports:
      - "8085:80"
    environment:
      - NODE_ENV=production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homepage.rule=Host(`home.homelab.lan`)"
      - "traefik.http.services.homepage.loadbalancer.server.port=80"
