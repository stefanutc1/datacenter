name: Scheduled Chaos Tests

on:
  schedule:
    - cron: '0 3 * * 0' # Weekly Sunday at 03:00 UTC
  workflow_dispatch:
    inputs:
      target_service:
        description: 'Target staging service to fault-inject'
        required: false
        default: 'staging-microservice'
      chaos_duration:
        description: 'Duration of stress test in seconds'
        required: false
        default: '15'

concurrency:
  group: chaos-resilience-${{ github.ref }}
  cancel-in-progress: false

jobs:
  chaos-engineering-validation:
    name: Chaos Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq stress-ng iproute2 curl jq
          chmod +x scripts/chaos/chaos_runner.sh

      - name: Start Staging Container
        run: |
          echo "Starting staging container..."
          docker run -d --name staging-microservice --restart=always -p 8088:80 nginx:alpine
          sleep 3
          curl -fsS http://localhost:8088 > /dev/null
          echo "Staging container ready."

      - name: CPU & Memory Stress Test
        run: |
          echo "Running CPU & RAM stress test..."
          bash scripts/chaos/chaos_runner.sh cpu-stress "${{ github.event.inputs.chaos_duration || '10' }}"
          bash scripts/chaos/chaos_runner.sh ram-pressure "${{ github.event.inputs.chaos_duration || '10' }}"

      - name: Service Fault & Recovery Test
        run: |
          echo "Testing service kill..."
          bash scripts/chaos/chaos_runner.sh service-kill 5 staging-microservice
          echo "Verifying container auto-restart..."
          bash scripts/chaos/chaos_runner.sh auto-healing-check 30 staging-microservice
          docker ps --filter "name=staging-microservice"

      - name: Network Degradation Test
        run: |
          echo "Testing network degradation..."
          bash scripts/chaos/chaos_runner.sh network-latency 5 lo 50ms || true
          bash scripts/chaos/chaos_runner.sh packet-loss 5 lo 10% || true

      - name: Alert Webhooks Test
        env:
          UPTIME_KUMA_URL: ${{ secrets.UPTIME_KUMA_PUSH_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "Validating alert webhooks..."
          bash scripts/chaos/chaos_runner.sh alert-webhook-validate

      - name: Cleanup
        if: always()
        run: |
          docker rm -f staging-microservice 2>/dev/null || true
          echo "Staging environment cleaned up."
