version: "3.8"

services:
  vector:
    image: timberio/vector:0.38.0-alpine
    container_name: vector-agent
    restart: unless-stopped
    ports:
      - "8686:8686"
    volumes:
      - ./vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - core-net

networks:
  core-net:
    external: true
