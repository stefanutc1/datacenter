version: "3.8"

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale-arm
    restart: unless-stopped
    hostname: pve-arm-tailscale
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_ROUTES=192.168.64.0/24
    volumes:
      - ./state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - arm-net

networks:
  arm-net:
    external: true
