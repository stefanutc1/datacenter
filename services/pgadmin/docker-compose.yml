version: "3.8"

services:
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@homelab.local
      - PGADMIN_DEFAULT_PASSWORD=pgadminpassword2026
    volumes:
      - ./data:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - core-net

networks:
  core-net:
    external: true
