version: "3.8"

services:
  opengist:
    image: ghcr.io/thomiceli/opengist:latest
    container_name: opengist
    restart: unless-stopped
    environment:
      - OPENGIST_ROOT_URL=https://gist.homelab.local
    volumes:
      - ./data:/opengist
    ports:
      - "6157:6157"
    networks:
      - arm-net

networks:
  arm-net:
    external: true
