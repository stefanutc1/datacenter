# OPNsense Monit Automated Watchdog & Self-Healing Engine
set daemon 30 # Poll every 30 seconds

# 1. Suricata NIDS/IPS Watchdog
check process suricata with pidfile /var/run/suricata.pid
  start program = "/usr/local/sbin/configctl ids start"
  stop program = "/usr/local/sbin/configctl ids stop"
  if failed host 127.0.0.1 port 8443 type tcp with timeout 5 seconds then restart
  if 5 restarts within 5 cycles then exec "/usr/local/bin/curl -d 'CRITICAL: Suricata crashed 5 times on OPNsense' https://ntfy.homelab.local/alerts"

# 2. Unbound DNS Watchdog
check process unbound with pidfile /var/run/unbound.pid
  start program = "/usr/local/sbin/configctl unbound start"
  stop program = "/usr/local/sbin/configctl unbound stop"
  if failed host 127.0.0.1 port 53 type udp with timeout 2 seconds then restart

# 3. Gateway Latency & Packet Loss Monitor
check host primary_gateway with address 192.168.1.1
  if ping count 5 loss > 20% for 3 cycles then exec "/usr/local/bin/curl -d 'WARNING: WAN Gateway packet loss > 20%' https://ntfy.homelab.local/alerts"
