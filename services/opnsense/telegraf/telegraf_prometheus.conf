# OPNsense Telegraf Agent -> Prometheus & Grafana Exporter
[global_tags]
  cluster = "homelab-enterprise"
  hypervisor = "pve-primary"
  node = "opnsense-gw"
  role = "core-firewall"

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"

[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = false

[[inputs.mem]]

[[inputs.net]]
  interfaces = ["vtnet0", "vtnet1", "vlan10", "vlan20", "vlan30", "vlan40", "vlan50"]

[[inputs.pf]]

[[outputs.prometheus_client]]
  listen = ":9273"
  path = "/metrics"
  expiration_interval = "60s"
