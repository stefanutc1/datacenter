# CrowdSec OPNsense Firewall Bouncer Configuration
mode: pf
pid_dir: /var/run/
update_frequency: 10s
daemonize: true
log_mode: file
log_dir: /var/log/
log_level: info
log_compression: true
log_max_size: 100
log_max_backups: 3
log_max_age: 30

api_url: http://127.0.0.1:8080/
api_key: "${CROWDSEC_BOUNCER_API_KEY}"
insecure_skip_verify: false

# Packet Filter (pf) Table Name
blacklists_ipv4: crowdsec_blacklists
blacklists_ipv6: crowdsec6_blacklists
pf:
  anchor_name: crowdsec
