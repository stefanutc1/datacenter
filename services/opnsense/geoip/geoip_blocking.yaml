# OPNsense GeoIP Ingress Filtering Configuration
# Packet Filter (pf) Kernel Alias: GeoIP_HighRisk_Blocks
%YAML 1.1
---
geoip_policy:
  name: "GeoIP_HighRisk_Drop"
  description: "Kernel-level stateful drop for high-risk geographical zones and threat origins"
  provider: "MaxMind GeoLite2 / DB-IP Country Lite"
  update_cron: "0 4 * * 1" # Every Monday at 04:00 UTC
  action: "block"
  direction: "in"
  interface: "wan"
  quick: true
  log: true
  blocked_countries:
    - RU # Russian Federation
    - CN # China
    - IR # Iran
    - KP # North Korea
    - BY # Belarus
    - VN # Vietnam
  exceptions:
    - "192.168.0.0/16" # RFC 1918 Private Class B
    - "10.0.0.0/8"     # RFC 1918 Private Class A
