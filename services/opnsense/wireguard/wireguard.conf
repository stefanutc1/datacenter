# OPNsense WireGuard Kernel Module Configuration (wg0)
[Interface]
Address = 10.10.0.1/24
ListenPort = 51820
PrivateKey = ${WG_PRIVATE_KEY}

# Peer: Secondary ARM64 Node (pve Apple M1)
[Peer]
PublicKey = ${ARM_NODE_PUBLIC_KEY}
AllowedIPs = 10.10.0.2/32, 192.168.64.0/24
PersistentKeepalive = 25

# Peer: Mobile & Admin Bastion
[Peer]
PublicKey = ${ADMIN_DEVICE_PUBLIC_KEY}
AllowedIPs = 10.10.0.5/32
PersistentKeepalive = 25
