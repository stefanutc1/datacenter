# OPNsense Unbound Recursive DNS & DNSSEC Configuration
server:
  interface: 0.0.0.0
  interface: ::0
  port: 53
  do-ip4: yes
  do-ip6: yes
  do-udp: yes
  do-tcp: yes
  
  # Security & Hardening
  hide-identity: yes
  hide-version: yes
  harden-glue: yes
  harden-dnssec-stripped: yes
  use-caps-for-id: yes
  val-clean-additional: yes
  
  # Split-Horizon Domain Overrides
  local-zone: "homelab.local." static
  local-data: "opnsense.homelab.local. IN A 192.168.1.134"
  local-data: "pve.homelab.local. IN A 192.168.1.132"
  local-data: "omv.homelab.local. IN A 192.168.1.135"
  local-data: "k8s.homelab.local. IN A 192.168.1.18"
