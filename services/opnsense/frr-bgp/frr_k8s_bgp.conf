# OPNsense FRRouting (FRR) Dynamic BGP Peering with Kubernetes MetalLB
router bgp 64512
  bgp router-id 192.168.1.134
  no bgp default ipv4-unicast
  neighbor K8S_NODES peer-group
  neighbor K8S_NODES remote-as 64513
  neighbor K8S_NODES password ${BGP_PEER_SECRET}
  
  # Kubernetes AMD Athlon Worker Node (192.168.1.18)
  neighbor 192.168.1.18 peer-group K8S_NODES
  neighbor 192.168.1.18 description "Kubernetes Bare-Metal Worker 1"
  
  address-family ipv4 unicast
    neighbor K8S_NODES activate
    neighbor K8S_NODES route-map K8S_INGRESS_MAP in
    redistribute connected
  exit-address-family
!
route-map K8S_INGRESS_MAP permit 10
  set local-preference 100
!
