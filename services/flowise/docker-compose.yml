version: "3.8"

services:
  flowise:
    image: flowiseai/flowise:latest
    container_name: flowise
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_TYPE=sqlite
      - APIKEY_PATH=/root/.flowise
      - SECRETKEY_PATH=/root/.flowise
      - FLOWISE_SECRETKEY_OVERWRITE=homelab_flowise_secret_key_2026
    volumes:
      - ./data:/root/.flowise
    networks:
      - core-net

networks:
  core-net:
    external: true
