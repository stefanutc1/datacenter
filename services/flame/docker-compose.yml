version: "3.8"

services:
  flame:
    image: pawelmalak/flame:latest
    container_name: flame
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "5005:5005"
    environment:
      - PASSWORD=homelab_flame_password_2026
    networks:
      - arm-net

networks:
  arm-net:
    external: true
