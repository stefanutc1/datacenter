version: "3.8"

services:
  whoogle-search:
    image: benbusby/whoogle-search:latest
    container_name: whoogle-search
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - WHOOGLE_CONFIG_GET_ONLY=1
    networks:
      - arm-net

networks:
  arm-net:
    external: true
