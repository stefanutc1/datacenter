version: "3.8"

services:
  kavita:
    image: jvmilazz0/kavita:latest
    container_name: kavita
    restart: unless-stopped
    ports:
      - "5005:5000"
    environment:
      - TZ=Europe/Bucharest
    volumes:
      - ./data:/kavita/config
      - ./manga:/manga
      - ./books:/books
    networks:
      - core-net

networks:
  core-net:
    external: true
