# OpenIndiana Hipster (VM 207 · illumos / Enterprise Solaris on Proxmox VE)
# Dedicated Unix Environment for Enterprise ZFS, illumos Zones, Crossbow VNICs, and DTrace
balloon: 1024
boot: order=scsi0
cores: 2
cpu: host
memory: 2048
name: openindiana
net0: virtio=BC:24:11:9E:02:07,bridge=vmbr0,firewall=1
numa: 0
ostype: solaris
scsi0: local-lvm:vm-207-disk-0,discard=on,size=30G,ssd=1
scsihw: virtio-scsi-single
sockets: 1
tags: openindiana;illumos;solaris;zfs;zones;dtrace;vm207
vga: std
