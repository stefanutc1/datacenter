# OpenIndiana Hipster (VM 207 · illumos / Enterprise Solaris on Proxmox VE)
# Dedicated Unix Environment for Enterprise ZFS, illumos Zones, Crossbow VNICs, and DTrace
services:
  openindiana:
    image: qemu-system-x86_64
    container_name: openindiana-vm207
    environment:
      OS: "OpenIndiana Hipster"
      RAM: "3072M"
      CORES: "2"
      DISK: "50G"
    ports:
      - "2207:22"
      - "5907:5900"
    restart: unless-stopped
