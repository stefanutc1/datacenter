# /etc/pve/qemu-server/300.conf
# Windows Server 2019 Standard (VM 300 · Enterprise Licensed Workload, Massgrave GVLK / KMS Activation)
balloon: 4096
boot: order=scsi0;ide2;net0
cores: 4
cpu: host
ide2: local:iso/windows_server_2019_x64.iso,media=cdrom
memory: 8192
name: windows-server-licenta
net0: virtio=BC:24:11:7C:2A:10,bridge=vmbr0,firewall=1
onboot: 0
ostype: win11
scsi0: local-lvm:vm-300-disk-0,discard=on,size=64G,ssd=1
scsihw: virtio-scsi-single
tags: microsoft;server;windows;windows-server-2019;licenta;vm300
