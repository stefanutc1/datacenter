# DragonFly BSD 6.4 (VM 210 · HAMMER2 & Hybrid Microkernel on Proxmox VE)
# Dedicated BSD Environment for HAMMER2 Journaling Storage, Lockless Kernels, and NUMA Scaling
balloon: 1024
boot: order=scsi0
cores: 2
cpu: host
memory: 2048
name: dragonflybsd
net0: virtio=BC:24:11:9E:02:10,bridge=vmbr0,firewall=1
numa: 0
ostype: other
scsi0: local-lvm:vm-210-disk-0,discard=on,size=30G,ssd=1
scsihw: virtio-scsi-single
sockets: 1
tags: dragonflybsd;bsd;hammer2;microkernel;numa;vm210
vga: std
