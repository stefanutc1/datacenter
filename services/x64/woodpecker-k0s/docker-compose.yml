services:
  woodpecker-server:
    image: woodpeckerci/woodpecker-server:v2.7.2
    container_name: woodpecker-server-k0s
    restart: always
    ports:
      - "8000:8000"
      - "9000:9000"
    environment:
      - WOODPECKER_OPEN=true
      - WOODPECKER_ADMIN=stefanut
      - WOODPECKER_HOST=https://ci-x64.homelab.local
      - WOODPECKER_SERVER_ADDR=:8000
      - WOODPECKER_GRPC_ADDR=:9000
      - WOODPECKER_GITEA=true
      - WOODPECKER_GITEA_URL=http://192.168.64.109:3000
    volumes:
      - /var/lib/woodpecker:/var/lib/woodpecker

  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:v2.7.2
    container_name: woodpecker-agent-k0s
    restart: always
    depends_on:
      - woodpecker-server
    environment:
      - WOODPECKER_SERVER=woodpecker-server:9000
      - WOODPECKER_MAX_WORKFLOWS=2
      - WOODPECKER_BACKEND=docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
