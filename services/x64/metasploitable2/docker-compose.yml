# Metasploitable 2 (VM 212 · Intentionally Vulnerable Linux Target on Proxmox VE)
# Vulnerable services: FTP (vsftpd 2.3.4), SSH, Telnet, SMTP, BIND, Apache, Samba, MySQL, PostgreSQL, Tomcat, UnrealIRCD
services:
  metasploitable2:
    image: tleemcjr/metasploitable2:latest
    container_name: metasploitable2-vm212
    environment:
      OS: "Ubuntu 8.04 (Hardened Vulnerable Target)"
      RAM: "512M"
      CORES: "1"
      DISK: "8G"
    ports:
      - "21:21"
      - "22:22"
      - "23:23"
      - "25:25"
      - "80:80"
      - "139:139"
      - "445:445"
      - "3306:3306"
      - "5432:5432"
      - "8180:8180"
    restart: unless-stopped
