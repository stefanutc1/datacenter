# NetBSD 10.0 (VM 208 · Clean Portable Unix on Proxmox VE)
# Dedicated Unix Environment for Rump Kernels, Anykernel, and pkgsrc Multi-Platform Packaging
balloon: 512
boot: order=scsi0
cores: 2
cpu: host
memory: 1024
name: netbsd
net0: virtio=BC:24:11:9E:02:08,bridge=vmbr0,firewall=1
numa: 0
ostype: other
scsi0: local-lvm:vm-208-disk-0,discard=on,size=20G,ssd=1
scsihw: virtio-scsi-single
sockets: 1
tags: netbsd;bsd;unix;rumpkernel;pkgsrc;vm208
vga: std
