# OpenStack Kolla-Ansible / Horizon Dashboard Service Definition
# Deployed on Node 1 (Intel i3-10100F) · VM 211 (192.168.1.211)
openstack_release: "2024.1"
kolla_base_distro: "ubuntu"
kolla_install_type: "source"

# Network Configuration
kolla_internal_vip_address: "192.168.1.211"
network_interface: "eth0"
neutron_external_interface: "eth1"

# Enabled OpenStack Services
enable_horizon: "yes"
enable_keystone: "yes"
enable_glance: "yes"
enable_nova: "yes"
enable_neutron: "yes"
enable_cinder: "yes"
enable_placement: "yes"
enable_mariadb: "yes"
enable_rabbitmq: "yes"
