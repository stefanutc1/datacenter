services:
  vault:
    image: hashicorp/vault:latest
    container_name: vault-secrets
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      - VAULT_ADDR=http://0.0.0.0:8200
      - VAULT_API_ADDR=http://192.168.1.132:8200
      - VAULT_LOCAL_CONFIG={"storage":{"file":{"path":"/vault/file"}},"listener":{"tcp":{"address":"0.0.0.0:8200","tls_disable":1}},"default_lease_ttl":"168h","max_lease_ttl":"720h","ui":true}
    cap_add:
      - IPC_LOCK
    volumes:
      - ./data:/vault/file
      - ./config:/vault/config
      - ./logs:/vault/logs
