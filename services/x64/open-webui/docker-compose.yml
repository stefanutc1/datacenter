services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - '3080:8080'
    environment:
      - OLLAMA_BASE_URL=http://192.168.1.110:11434
      - WEBUI_SECRET_KEY=secret_key_change_me
    volumes:
      - ./data:/app/backend/data
