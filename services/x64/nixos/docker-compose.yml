# NixOS 24.11 Minimal (VM 204 · Declarative Immutable Linux on Proxmox VE)
# Flakes, Declarative Nix Expressions, and Reproducible Infrastructure
services:
  nixos:
    image: qemu-system-x86_64
    container_name: nixos-vm204
    environment:
      OS: "NixOS 24.11 Minimal"
      RAM: "1024M"
      CORES: "2"
      DISK: "22G"
    ports:
      - "2204:22"
    restart: unless-stopped
