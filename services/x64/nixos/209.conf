# NixOS 24.11 (VM 209 · Declarative Immutable Linux on Proxmox VE)
# Dedicated Environment for Nix Flakes, Hermetic Reproducible Builds, and Atomic Rollbacks
balloon: 1024
boot: order=scsi0
cores: 2
cpu: host
memory: 2048
name: nixos
net0: virtio=BC:24:11:9E:02:09,bridge=vmbr0,firewall=1
numa: 0
ostype: l26
scsi0: local-lvm:vm-209-disk-0,discard=on,size=40G,ssd=1
scsihw: virtio-scsi-single
sockets: 1
tags: nixos;nix;flakes;immutable;declarative;reproducible;vm209
vga: std
