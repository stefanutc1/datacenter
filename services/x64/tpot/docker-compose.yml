# T-Pot Multi-Honeypot Decoy Platform (VM 213)
# Decoy daemons: Cowrie (SSH/Telnet), Dionaea (SMB/MSSQL/FTP), Conpot (ICS/SCADA), Elastic & Kibana (:64297)
services:
  tpot:
    image: dtag-dev-sec/tpotinit:latest
    container_name: tpot-platform-vm213
    environment:
      TPOT_TYPE: "STANDARD"
      WEB_PORT: "64297"
    ports:
      - "64297:64297"
      - "2222:22"
      - "80:80"
      - "443:443"
    restart: unless-stopped
