services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    ports:
      - '53:53/tcp'
      - '53:53/udp'
      - '80:80'
    environment:
      TZ: 'Europe/Bucharest'
      WEBPASSWORD: 'SetSecurePasswordHere'
      FTLCONF_LOCAL_IPV4: '192.168.1.4'
    volumes:
      - ./etc-pihole:/etc/pihole
      - ./etc-dnsmasq.d:/etc/dnsmasq.d
    cap_add:
      - NET_ADMIN
