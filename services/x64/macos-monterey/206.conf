# /etc/pve/qemu-server/206.conf
# macOS Monterey 12.7 (VM 206 · OpenCore KVM Hackintosh on Proxmox VE)
# Node: Node 1 (Intel Core i3-10100F · 12GB DDR4-2133)
agent: 1
args: -device isa-applesmc,osk="ourhardworkbythesewordsguardedpleasedontsteal(c)AppleComputerInc" -smbios type=2 -cpu host,kvm=on,vendor=GenuineIntel,+invtsc,+hypervisor,kvm=off,vmx=on -device usb-kbd,bus=ehci.0,port=2
balloon: 2048
bios: ovmf
boot: order=ide2;virtio0
cores: 4
cpu: host
efidisk0: local-lvm:vm-206-disk-0,efitype=4m,pre-enrolled-keys=0,size=4M
ide2: local:iso/OpenCore-v20.iso,media=cdrom,size=150M
machine: q35
memory: 4096
name: macos-monterey
net0: vmxnet3=BC:24:11:52:06:01,bridge=vmbr0,tag=20
numa: 0
ostype: other
scsihw: virtio-scsi-pci
sockets: 1
tags: macos;monterey;hackintosh;opencore;apple;vm206
vga: vmware
virtio0: local-lvm:vm-206-disk-1,cache=unsafe,discard=on,size=64G
