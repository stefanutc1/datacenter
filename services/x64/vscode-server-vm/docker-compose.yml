# VS Code Server Dedicated VM (VM 207 on Proxmox VE Node 1)
# Production Headless Visual Studio Code Server for Remote Cloud Development
services:
  vscode-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: vscode-server-vm207
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Bucharest
      - PASSWORD=Stefanut005
      - SUDO_PASSWORD=Stefanut005
      - DEFAULT_WORKSPACE=/config/workspace
    volumes:
      - ./config:/config
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8443"
    restart: unless-stopped
