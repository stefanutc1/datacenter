# /etc/pve/qemu-server/207.conf
# VS Code Server Dedicated VM (VM 207 on Proxmox VE Node 1)
# Workload: Headless Visual Studio Code Server & Isolated Docker-in-Docker DevContainers
agent: 1
balloon: 1024
bios: ovmf
boot: order=scsi0
cores: 2
cpu: host
description: Secondary Dedicated VS Code Server Cloud Workspace (VM 207)
efidisk0: local-lvm:vm-207-disk-0,efitype=4m,pre-enrolled-keys=1,size=4M
machine: q35
memory: 2048
name: vscode-server-vm207
net0: virtio=BC:24:11:02:07:01,bridge=vmbr0,tag=20
numa: 0
onboot: 1
ostype: l26
scsi0: local-lvm:vm-207-disk-1,discard=on,size=32G,ssd=1
scsihw: virtio-scsi-pci
sockets: 1
tags: dev;vscode;codeserver;ide;docker;terraform;vm207
vga: serial0
serial0: socket
