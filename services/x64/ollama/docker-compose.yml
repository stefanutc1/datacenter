services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - '11434:11434'
    environment:
      OLLAMA_HOST: '0.0.0.0'
      OLLAMA_MODELS: '/root/.ollama/models'
      OLLAMA_KEEP_ALIVE: '24h'
    volumes:
      - ./models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
