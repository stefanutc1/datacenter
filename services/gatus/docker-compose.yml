version: "3.8"

services:
  gatus:
    image: twinproduction/gatus:latest
    container_name: gatus
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config:/config
    environment:
      - GATUS_CONFIG_PATH=/config
    networks:
      - arm-net

networks:
  arm-net:
    external: true
