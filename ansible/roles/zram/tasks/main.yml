---
- name: Install zram-tools on Debian/Proxmox host
  apt:
    name: zram-tools
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: Configure zramswap configuration file
  copy:
    dest: /etc/default/zramswap
    content: |
      # Managed by Ansible — Homelab ZRAM Tuning
      ALGO=lz4
      PERCENT=50
      PRIORITY=100
    owner: root
    group: root
    mode: '0644'
  notify: Restart zramswap

- name: Apply kernel virtual memory parameters for ZRAM
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: /etc/sysctl.d/99-zram.conf
    reload: yes
  loop:
    - { name: 'vm.swappiness', value: '60' }
    - { name: 'vm.vfs_cache_pressure', value: '50' }
    - { name: 'vm.page-cluster', value: '0' }

- name: Enable and start zramswap service
  systemd:
    name: zramswap
    enabled: yes
    state: started
