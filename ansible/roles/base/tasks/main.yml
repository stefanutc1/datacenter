---
- name: Set system timezone
  community.general.timezone:
    name: "{{ system_timezone }}"

- name: Update apt cache and install baseline packages (Debian/Ubuntu)
  ansible.builtin.apt:
    name: "{{ common_packages_debian }}"
    state: present
    update_cache: yes
    cache_valid_time: 86400
  when: ansible_os_family == 'Debian'

- name: Install baseline packages (Alpine)
  community.general.apk:
    name: "{{ common_packages_alpine }}"
    state: present
    update_cache: yes
  when: ansible_os_family == 'Alpine'

- name: Configure system limits (/etc/security/limits.conf)
  ansible.builtin.pam_limits:
    domain: "*"
    limit_type: "{{ item.type }}"
    limit_item: "{{ item.item }}"
    value: "{{ item.value }}"
  loop:
    - { type: "soft", item: "nofile", value: 65536 }
    - { type: "hard", item: "nofile", value: 65536 }
    - { type: "soft", item: "nproc", value: 32768 }
    - { type: "hard", item: "nproc", value: 32768 }
  when: ansible_os_family == 'Debian'
