---
- name: Configure Homelab Infrastructure & Roles
  hosts: all
  become: true
  roles:
    - home_assistant
    - system_hardening

  tasks:
    - name: Ensure Home Assistant configuration directory exists
      ansible.builtin.file:
        path: /opt/homeassistant/config
        state: directory
        owner: root
        group: root
        mode: '0755'
