      ansible.builtin.debug:
        msg: "Checking OpenStack controller at 192.168.1.211"

    - name: Provision Kolla-Ansible / OpenStack Micro-Cloud Components
      ansible.builtin.debug:
        msg: "Verifying Nova compute, Neutron SDN, Keystone IAM, Glance images, and Horizon Dashboard on port 80"
