---
# ==============================================================================
# Playbook 11: Enterprise Proxmox Software Defined Networking (SDN) & Sysctl
# Managed by Antigravity - Datacenter Core Infrastructure
# ==============================================================================

- name: Deploy Proxmox SDN & Kernel Network Tuning
  hosts: hypervisors
  become: true
  gather_facts: true

  tasks:
    - name: Ensure required Proxmox SDN packages are installed
      ansible.builtin.apt:
        name:
          - libpve-network-perl
          - ifupdown2
          - bridge-utils
          - vlan
          - iptables
          - ipset
          - nftables
          - ethtool
        state: present
        update_cache: false

    - name: Apply Enterprise Kernel Network Hardening & Performance Sysctl
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: true
      loop:
        # IPv4 Forwarding & Routing
        - { name: "net.ipv4.ip_forward", value: "1" }
        - { name: "net.ipv6.conf.all.forwarding", value: "1" }
        
        # Reverse Path Filtering (Anti-Spoofing)
        - { name: "net.ipv4.conf.all.rp_filter", value: "1" }
        - { name: "net.ipv4.conf.default.rp_filter", value: "1" }
        
        # SYN-Flood & Connection Tracking Protection
        - { name: "net.ipv4.tcp_syncookies", value: "1" }
        - { name: "net.ipv4.tcp_syn_retries", value: "2" }
        - { name: "net.ipv4.tcp_synack_retries", value: "2" }
        - { name: "net.netfilter.nf_conntrack_max", value: "262144" }
        - { name: "net.netfilter.nf_conntrack_tcp_timeout_established", value: "28800" }
        
        # ICMP Bogon & Redirect Filtering
        - { name: "net.ipv4.conf.all.accept_redirects", value: "0" }
        - { name: "net.ipv4.conf.default.accept_redirects", value: "0" }
        - { name: "net.ipv4.conf.all.send_redirects", value: "0" }
        - { name: "net.ipv4.conf.default.send_redirects", value: "0" }
        - { name: "net.ipv4.conf.all.accept_source_route", value: "0" }
        - { name: "net.ipv4.icmp_echo_ignore_broadcasts", value: "1" }
        - { name: "net.ipv4.icmp_ignore_bogus_error_responses", value: "1" }
        
        # High-Throughput Buffers & BBR Congestion Control
        - { name: "net.core.default_qdisc", value: "fq" }
        - { name: "net.ipv4.tcp_congestion_control", value: "bbr" }
        - { name: "net.core.somaxconn", value: "4096" }
        - { name: "net.core.netdev_max_backlog", value: "10000" }
        - { name: "net.core.bpf_jit_enable", value: "1" }

    - name: Ensure Proxmox SDN configuration directories exist
      ansible.builtin.file:
        path: /etc/pve/sdn
        state: directory
        mode: '0755'
        owner: root
        group: www-data

    - name: Deploy Proxmox SDN Zones Configuration
      ansible.builtin.copy:
        dest: /etc/pve/sdn/zones.cfg
        content: |
          vlan: datacenter-vlan
          	bridge-ports nic0
          	ipam pve

          simple: datacenter-core
          	ipam pve
        owner: root
        group: www-data
        mode: '0640'

    - name: Deploy Proxmox SDN VNets Configuration
      ansible.builtin.copy:
        dest: /etc/pve/sdn/vnets.cfg
        content: |
          vnet: vnet-mgmt
          	zone datacenter-vlan
          	tag 10

          vnet: vnet-transit
          	zone datacenter-core
          	tag 20

          vnet: vnet-dmz
          	zone datacenter-vlan
          	tag 30

          vnet: vnet-trusted
          	zone datacenter-vlan
          	tag 40

          vnet: vnet-cloud
          	zone datacenter-core
          	tag 50

          vnet: vnet-lab
          	zone datacenter-vlan
          	tag 60
        owner: root
        group: www-data
        mode: '0640'

    - name: Deploy Proxmox SDN Subnets Configuration
      ansible.builtin.copy:
        dest: /etc/pve/sdn/subnets.cfg
        content: |
          subnet: datacenter-vlan-10.10.10.0-24
          	vnet vnet-mgmt
          	gateway 10.10.10.1

          subnet: datacenter-core-10.10.20.0-30
          	vnet vnet-transit
          	gateway 10.10.20.1

          subnet: datacenter-vlan-10.10.30.0-24
          	vnet vnet-dmz
          	gateway 10.10.30.1

          subnet: datacenter-vlan-10.10.40.0-24
          	vnet vnet-trusted
          	gateway 10.10.40.1

          subnet: datacenter-core-10.10.50.0-24
          	vnet vnet-cloud
          	gateway 10.10.50.1

          subnet: datacenter-vlan-10.10.60.0-24
          	vnet vnet-lab
          	gateway 10.10.60.1
        owner: root
        group: www-data
        mode: '0640'

    - name: Reload Proxmox SDN Configuration
      ansible.builtin.command: pvesdn reload
      changed_when: true
