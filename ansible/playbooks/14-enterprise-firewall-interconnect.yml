---
# ==============================================================================
# Playbook 14: Enterprise Dual-Firewall Interconnect (OPNsense <-> FortiGate/ASAv)
# Managed by Antigravity - High-Availability Defense-in-Depth
# ==============================================================================

- name: Configure Dual-Firewall Transit Network & Microsegmentation
  hosts: hypervisors
  become: true
  gather_facts: true

  vars:
    transit_bridge: "vmbr2"
    dmz_bridge: "vmbr3"
    core_bridge: "vmbr4"
    opnsense_transit_ip: "10.10.20.1/30"
    fortigate_transit_ip: "10.10.20.2/30"
    fortigate_mgmt_ip: "192.168.1.136/24"
    fortigate_vmid: 221

  tasks:
    - name: Ensure Transit and Security Zone Bridges are configured in /etc/network/interfaces
      ansible.builtin.blockinfile:
        path: /etc/network/interfaces
        marker: "# {mark} ANSIBLE MANAGED ENTERPRISE FIREWALL BRIDGES"
        block: |
          auto {{ transit_bridge }}
          iface {{ transit_bridge }} inet manual
          	bridge-ports none
          	bridge-stp off
          	bridge-fd 0
          # Transit Inter-Firewall Network (OPNsense <-> FortiGate/ASAv)

          auto {{ dmz_bridge }}
          iface {{ dmz_bridge }} inet manual
          	bridge-ports none
          	bridge-stp off
          	bridge-fd 0
          # Enterprise DMZ Network

          auto {{ core_bridge }}
          iface {{ core_bridge }} inet manual
          	bridge-ports none
          	bridge-stp off
          	bridge-fd 0
          # Enterprise Trusted Core Network

    - name: Bring up Enterprise Firewall Bridges
      ansible.builtin.shell: |
        ip link set {{ transit_bridge }} up 2>/dev/null || true
        ip link set {{ dmz_bridge }} up 2>/dev/null || true
        ip link set {{ core_bridge }} up 2>/dev/null || true
      changed_when: false

    - name: Check if FortiGate VM {{ fortigate_vmid }} configuration exists
      ansible.builtin.stat:
        path: "/etc/pve/qemu-server/{{ fortigate_vmid }}.conf"
      register: fg_conf_stat

    - name: Deploy FortiOS / ASAv Automation Bootstrap Script
      ansible.builtin.copy:
        dest: /usr/local/bin/bootstrap-enterprise-firewall.sh
        content: |
          #!/usr/bin/env bash
          # ==============================================================================
          # FortiGate-VM / Cisco ASAv Bootstrap & Interconnect Provisioner
          # Managed by Antigravity IaC
          # ==============================================================================
          set -euo pipefail

          VMID="{{ fortigate_vmid }}"
          VM_NAME="fortigate-vm"

          echo "[+] Validating VM $VMID ($VM_NAME)..."
          if ! qm status "$VMID" >/dev/null 2>&1; then
            echo "[+] Creating Enterprise Firewall VM $VMID..."
            qm create "$VMID" \
              --name "$VM_NAME" \
              --memory 2048 \
              --cores 2 \
              --cpu host \
              --net0 virtio,bridge={{ transit_bridge }} \
              --net1 virtio,bridge=vmbr0 \
              --net2 virtio,bridge={{ dmz_bridge }} \
              --net3 virtio,bridge={{ core_bridge }} \
              --scsihw virtio-scsi-single \
              --serial0 socket \
              --vga serial0 \
              --ostype l26 \
              --tags "firewall;fortinet;enterprise;router;kvm" \
              --onboot 0
          fi

          echo "[✓] Enterprise Firewall VM $VMID is ready."
        owner: root
        group: root
        mode: '0755'

    - name: Deploy FortiOS CLI Initial Configuration Template
      ansible.builtin.copy:
        dest: /etc/pve/fortigate_bootstrap.conf
        content: |
          # ==============================================================================
          # FortiOS Enterprise Bootstrap Configuration Template
          # ==============================================================================
          config system global
              set hostname "fortigate-core"
              set timezone 26
              set admin-sport 8443
          end

          config system interface
              edit "port1"
                  set mode static
                  set ip 10.10.20.2 255.255.255.252
                  set allowaccess ping
                  set description "Transit to OPNsense"
              next
              edit "port2"
                  set mode static
                  set ip 192.168.1.136 255.255.255.0
                  set allowaccess ping https ssh snmp
                  set description "Management Out-of-Band"
              next
              edit "port3"
                  set mode static
                  set ip 10.10.30.1 255.255.255.0
                  set allowaccess ping
                  set description "Enterprise DMZ"
              next
              edit "port4"
                  set mode static
                  set ip 10.10.40.1 255.255.255.0
                  set allowaccess ping
                  set description "Trusted Enterprise Core"
              next
          end

          config router static
              edit 1
                  set dst 0.0.0.0 0.0.0.0
                  set gateway 10.10.20.1
                  set device "port1"
                  set comment "Default Gateway via OPNsense Perimeter"
              next
          end

          config router bgp
              set as 65002
              set router-id 10.10.20.2
              config neighbor
                  edit "10.10.20.1"
                      set remote-as 65000
                      set description "OPNsense Perimeter Core"
                  next
              end
          end
        owner: root
        group: root
        mode: '0640'
