# OpenStack Enterprise Private Cloud Architecture & Manifest Specification (Node 1 · VM 211)
apiVersion: v1
kind: Namespace
metadata:
  name: openstack
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openstack-release-info
  namespace: openstack
data:
  release: "2024.1-caracal"
  deployment_model: "kolla-ansible-containerized"
  controller_ip: "192.168.1.211"
  keystone_auth_url: "http://192.168.1.211:5000/v3"
  horizon_dashboard_url: "http://192.168.1.211:80"
  services: |
    - keystone: Identity & Authentication (v3 API)
    - glance: Image Catalog & ISO Storage
    - nova: Compute Virtualization & Hypervisor Scheduler (KVM)
    - neutron: Software Defined Networking (ML2 / OVN / VXLAN)
    - cinder: Block Storage & Volume Management
    - horizon: Web Control Dashboard
    - placement: Resource Tracking Engine
    - rabbitmq: High-Performance Message Bus
    - mariadb: Galera Clustered Metadata Database
