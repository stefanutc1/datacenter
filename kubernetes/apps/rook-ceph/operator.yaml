apiVersion: v1
kind: Namespace
metadata:
  name: rook-ceph
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rook-ceph-operator
  namespace: rook-ceph
  labels:
    operator: rook
    storage-backend: ceph
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rook-ceph-operator
  template:
    metadata:
      labels:
        app: rook-ceph-operator
    spec:
      serviceAccountName: rook-ceph-system
      containers:
        - name: rook-ceph-operator
          image: rook/ceph:v1.15.2
          args: ["ceph", "operator"]
          env:
            - name: ROOK_LOG_LEVEL
              value: INFO
            - name: ROOK_ENABLE_DISCOVERY_DAEMON
              value: "true"
            - name: ROOK_CEPH_STATUS_CHECK_INTERVAL
              value: "60s"
            - name: ROOK_MON_HEALTHCHECK_INTERVAL
              value: "45s"
            - name: ROOK_OSD_ENABLE_PROGRESS_MONITORING
              value: "true"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
