# Cilium eBPF CNI Configuration for Hybrid Cluster (x86_64 Node 1 + Apple Silicon Node 3)
cluster:
  name: homelab-cluster
  id: 1

routingMode: native
autoDirectNodeRoutes: true
ipv4NativeRoutingCIDR: 10.244.0.0/16

# eBPF Host Routing
bpf:
  masquerade: true
  hostRouting: true

# WireGuard Transparent In-Transit Encryption
encryption:
  enabled: true
  type: wireguard
  nodeEncryption: true

# Kube-Proxy Replacement
kubeProxyReplacement: true
k8sServiceHost: 192.168.1.18
k8sServicePort: 6443

# IPAM
ipam:
  mode: kubernetes

# L7 Network Security Policy Enforcement
policyEnforcementMode: default

# Hubble Observability & Telemetry
hubble:
  enabled: true
  metrics:
    enabled:
      - dns:query;ignoreAAAA
      - drop
      - tcp
      - flow
      - icmp
      - http
  relay:
    enabled: true
  ui:
    enabled: true
    replicas: 1
    ingress:
      enabled: true
      hosts:
        - hubble.homelab.local
