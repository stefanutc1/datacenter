# ==============================================================================
# Cilium eBPF L3-L7 Strict mTLS Network Security Policy
# Enforces mutual TLS (SPIFFE/SPIRE) between Talos K8s nodes and VLAN 20
# critical microservices, eliminating cleartext inter-container communication.
# ==============================================================================
apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: strict-mtls-clusterwide-baseline
spec:
  description: "Enforces SPIFFE/SPIRE mutual TLS authentication on all inter-workload traffic"
  endpointSelector:
    matchLabels: {}
  ingress:
    - fromEndpoints:
        - matchLabels: {}
      authentication:
        mode: required
  egress:
    - toEndpoints:
        - matchLabels: {}
      authentication:
        mode: required
---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: strict-mtls-vlan20-critical-services
  namespace: production
spec:
  description: "Enforces strict L7 mTLS between Talos pods and VLAN 20 microservices (NPM, Authentik, Vaultwarden)"
  endpointSelector:
    matchLabels:
      tier: critical
  ingress:
    - fromCIDRSet:
        - cidr: 192.168.20.0/24 # VLAN 20 Microservices subnet
      authentication:
        mode: required
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "8443"
              protocol: TCP
          rules:
            http:
              - method: ".*"
                path: ".*"
  egress:
    - toCIDRSet:
        - cidr: 192.168.20.0/24 # VLAN 20 Microservices
      authentication:
        mode: required
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "8443"
              protocol: TCP
            - port: "9000" # MinIO S3 API
              protocol: TCP
