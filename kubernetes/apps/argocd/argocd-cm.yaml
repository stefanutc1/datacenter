apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  url: https://argocd.homelab.local
  application.instanceLabelKey: argocd.argoproj.io/instance
  admin.enabled: "true"
  resource.customizations: |
    cilium.io/CiliumNetworkPolicy:
      health.lua: |
        hs = {}
        hs.status = "Healthy"
        return hs
  repositories: |
    - type: git
      url: https://github.com/stefanutc1/homelab.git
      name: homelab-repo
