<div class="min-h-screen bg-warm-bg text-warm-primary font-sans flex flex-col antialiased selection:bg-terracotta-500/25 selection:text-sand-50">
  
  <!-- Global Top Header -->
  <app-header></app-header>

  <!-- MAIN EDITORIAL & ENGINEERING PRESENTATION -->
  <main class="flex-1 w-full flex flex-col">
    
    <!-- 1. Editorial Overview & Architecture Vision -->
    <div id="overview">
      <app-overview></app-overview>
    </div>

    <!-- 2. Interactive 3D Spatial Topology Section -->
    <section id="topology-section" class="w-full py-12 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto border-b border-clay-800/40">
      <app-topology-canvas
        [selectedNode]="selectedNode"
        [activeCategory]="activeCategory"
        [perspective]="perspective"
        (nodeSelected)="onNodeSelected($event)"
        (categoryChanged)="onCategoryChanged($event)"
        (perspectiveChanged)="onPerspectiveChanged($event)"
      ></app-topology-canvas>
    </section>

    <!-- Node Inspector Drawer (Shows when a node is clicked) -->
    <app-node-inspector
      [node]="selectedNode"
      (close)="onNodeSelected(null)"
      (selectConnected)="onNodeSelected($event)"
    ></app-node-inspector>

    <!-- 3. Physical Hardware Fleet -->
    <div class="border-b border-clay-800/40">
      <app-hardware-fleet
        (nodeFocused)="onNodeSelected($event)"
      ></app-hardware-fleet>
    </div>

    <!-- 4. Active Microservices Catalog (34 Workloads) -->
    <div class="border-b border-clay-800/40">
      <app-service-matrix
        (nodeFocused)="onNodeSelected($event)"
      ></app-service-matrix>
    </div>

    <!-- 5. Engineering Blueprint, VLANs & Cyber/DFIR Stack -->
    <app-architecture-blueprint></app-architecture-blueprint>

  </main>

  <!-- Technical Presentation Footer -->
  <footer class="w-full py-12 px-4 sm:px-6 lg:px-8 border-t border-clay-800/60 bg-[#0e0b08] font-sans text-xs text-sand-400">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2.5 text-sand-300">
        <span class="w-2 h-2 rounded-full bg-terracotta-500"></span>
        <span class="font-serif font-bold text-sm text-sand-50">Homelab Digital Twin</span>
        <span class="text-sand-400 text-xs">— Proxmox VE · Windows Server AD · WireGuard · Wazuh XDR · DFIR · ELO</span>
      </div>
      <div class="flex items-center gap-6 font-mono text-xs">
        <a href="#overview" class="hover:text-sand-50 transition-colors">TOP ↑</a>
        <a href="https://github.com/stefanutc1/homelab" target="_blank" rel="noopener noreferrer" class="hover:text-sand-50 transition-colors underline">GITHUB REPO</a>
      </div>
    </div>
  </footer>

</div>
