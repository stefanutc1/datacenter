<div class="min-h-screen bg-warm-bg text-warm-primary font-sans flex flex-col antialiased selection:bg-terracotta-500/30 selection:text-terracotta-200">
  
  <!-- Global Enterprise Header -->
  <app-header></app-header>

  <!-- MAIN VIEWPORT: 3D INFRASTRUCTURE TOPOLOGY -->
  <main class="flex-1 w-full flex flex-col">
    
    <section id="topology-section" class="w-full h-[calc(100vh-4rem)] min-h-[620px] max-h-[920px] p-4 sm:p-6 max-w-7xl mx-auto flex flex-col">
      <app-topology-canvas
        [selectedNode]="selectedNode"
        [activeCategory]="activeCategory"
        [perspective]="perspective"
        (nodeSelected)="onNodeSelected($event)"
        (categoryChanged)="onCategoryChanged($event)"
        (perspectiveChanged)="onPerspectiveChanged($event)"
      ></app-topology-canvas>
    </section>

    <!-- Node Inspector Drawer (Shows when a node is clicked) -->
    <app-node-inspector
      [node]="selectedNode"
      (close)="onNodeSelected(null)"
      (selectConnected)="onNodeSelected($event)"
    ></app-node-inspector>

    <!-- BELOW-THE-FOLD ENTERPRISE INFRASTRUCTURE PANELS -->
    
    <!-- 1. All 34 Containerized Microservices -->
    <app-service-matrix
      (nodeFocused)="onNodeSelected($event)"
    ></app-service-matrix>

    <!-- 2. Heterogeneous Physical Hardware Fleet -->
    <app-hardware-fleet
      (nodeFocused)="onNodeSelected($event)"
    ></app-hardware-fleet>

    <!-- 3. Engineering Blueprint & VLAN Schematics -->
    <app-architecture-blueprint></app-architecture-blueprint>

  </main>

  <!-- Technical Footer -->
  <footer class="w-full py-10 px-4 sm:px-6 lg:px-8 border-t border-clay-700/40 bg-[#100c09] font-mono text-xs text-sand-400">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2.5 text-sand-300">
        <span class="w-2 h-2 rounded-full bg-terracotta-500"></span>
        <span class="font-bold font-serif text-sm text-sand-50">Homelab Digital Twin</span>
        <span>— Proxmox VE · WireGuard · Wazuh XDR · k3s · ELO</span>
      </div>
      <div class="flex items-center gap-6">
        <a href="#topology-section" class="hover:text-terracotta-400 transition-colors">TOP OF MAP ↑</a>
        <a href="https://github.com/stefanutc1/homelab" target="_blank" rel="noopener noreferrer" class="hover:text-terracotta-400 transition-colors underline">GITHUB</a>
      </div>
    </div>
  </footer>

</div>
