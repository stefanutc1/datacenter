# ==============================================================================
# Homelab Low-Level Kernel & Network Sysctl Tuning Profile
# High-Throughput NVMe-oF, 10GbE Bridge Offloading & Micro-Burst Optimization
# ==============================================================================

# Network Core Socket Buffers (64MB Max Window)
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
net.core.rmem_default = 33554432
net.core.wmem_default = 33554432
net.core.optmem_max = 2048576

# Network Device Ingress Queue & Backlog Limits
net.core.netdev_max_backlog = 300000
net.core.netdev_budget = 600
net.core.netdev_budget_usecs = 8000
net.core.somaxconn = 65535

# TCP Socket Memory Boundaries (Min, Default, Max in bytes)
net.ipv4.tcp_rmem = 4096 87380 67108864
net.ipv4.tcp_wmem = 4096 65536 67108864

# TCP Congestion Control (BBR + Fair Queueing)
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# TCP Performance & Latency Optimizations
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_max_syn_backlog = 3240000
net.ipv4.tcp_syn_retries = 3
net.ipv4.tcp_synack_retries = 3
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 15
net.ipv4.tcp_keepalive_probes = 5

# Virtual Memory Page Management & Compaction
vm.swappiness = 10
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10
vm.vfs_cache_pressure = 50
vm.compaction_proactiveness = 50
vm.min_free_kbytes = 1048576

# File Descriptor & Inotify Watch Limits
fs.file-max = 20971520
fs.inotify.max_user_watches = 1048576
fs.inotify.max_user_instances = 8192
