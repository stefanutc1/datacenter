name: CI Matrix

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  security-events: write
  packages: write
  pages: write
  id-token: write

jobs:
  terraform-validate:
    name: Terraform Format & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Check Terraform Formatting
        run: |
          terraform fmt -check -recursive terraform/
          terraform fmt -check -recursive cloud/

      - name: Validate Terraform Modules
        run: |
          for dir in terraform terraform/modules/proxmox_lxc terraform/modules/proxmox_vm terraform/proxmox cloud/azure cloud/gcp cloud/aws; do
            if [ -d "$dir" ]; then
              echo "Validating $dir..."
              (cd "$dir" && terraform init -backend=false && terraform validate)
            fi
          done

  iac-security-scan:
    name: IaC Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy IaC Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: './terraform'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Run Checkov IaC Security Analysis
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          soft_fail: true

  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ansible-lint
        run: pip install ansible-lint ansible

      - name: Run Ansible Lint
        run: |
          if [ -d "ansible" ]; then
            ansible-lint ansible/ || true
          fi

  hadolint-scan:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Hadolint
        run: |
          if ! command -v hadolint &> /dev/null; then
            for i in 1 2 3; do
              sudo curl -fSL --connect-timeout 10 --retry 3 -o /usr/local/bin/hadolint "https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64" && sudo chmod +x /usr/local/bin/hadolint && break || sleep 2
            done
          fi
          find . -name "*Dockerfile*" -not -path "./web/node_modules/*" | while read -r df; do
            echo "Linting $df..."
            if command -v hadolint &> /dev/null; then
              hadolint --ignore DL3008 --ignore DL3013 --ignore DL3018 "$df" || true
            elif command -v docker &> /dev/null; then
              docker run --rm -i hadolint/hadolint hadolint --ignore DL3008 --ignore DL3013 --ignore DL3018 - < "$df" || true
            else
              echo "Skipping $df (hadolint not installed)"
            fi
          done

  gitleaks-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  docker-compose-validate:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate All Compose Files
        run: |
          find services cyber -name "docker-compose*.yml" -o -name "compose*.yaml" | while read -r compose_file; do
            echo "Checking syntax for $compose_file..."
            docker compose -f "$compose_file" config --quiet || true
          done

  markdown-quality:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run markdownlint
        run: |
          npx markdownlint-cli "**/*.md" --ignore node_modules --ignore web/dist || true

  build-and-deploy-web:
    name: Web App Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        run: cd web && npm ci

      - name: Build Web Application
        run: cd web && npm run build

  terraform-docs:
    name: Terraform Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Render Terraform Docs
        uses: terraform-docs/gh-actions@v1.3.0
        with:
          working-dir: terraform/modules/proxmox_lxc,terraform/modules/proxmox_vm,terraform/proxmox
          output-file: README.md
          output-method: replace
          fail-on-diff: false

  cosign-verify:
    name: Cosign Verification
    runs-on: ubuntu-latest
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Verify Cosign Installation
        run: cosign version

  container-vulnerability-scan:
    name: Container Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan Local Dockerfiles with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  nginx-config-test:
    name: Nginx Config Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test Nginx Configurations
        run: |
          docker run --rm -v "${PWD}:/workspace" -w /workspace nginx:alpine sh -c "
            find . -name '*.conf' -path '*/nginx/*' -exec nginx -t -c {} \; 2>/dev/null || true
          "

  renovate-validate:
    name: Renovate Config Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Renovate JSON
        run: |
          docker run --rm -v "${PWD}:/usr/src/app" -w /usr/src/app renovate/renovate:latest renovate-config-validator || true

  pipeline-notification:
    name: Notification
    runs-on: ubuntu-latest
    needs: [terraform-validate, iac-security-scan, build-and-deploy-web]
    if: failure()
    steps:
      - name: Dispatch Alert on Failure
        run: |
          echo "CI check failed for commit ${{ github.sha }} on ${{ github.ref }}"

  changelog-release:
    name: Commit Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Conventional Commits
        uses: wagoid/commitlint-github-action@v6
        continue-on-error: true
