version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
    open-pull-requests-limit: 10

  # Web Frontend (Angular 20)
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10

  # Cyber DFIR Visualizers
  - package-ecosystem: "npm"
    directory: "/cyber/openid-mitm-phishing-forensics/web"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/cyber/revolut-vishing-forensics/web"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/cyber/task-scam-infrastructure-analysis/web"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5

  # Python / ELO Monorepo
  - package-ecosystem: "pip"
    directory: "/elo/apps/elo-core"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5

  # Terraform
  - package-ecosystem: "terraform"
    directory: "/terraform"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(tf-deps)"
    open-pull-requests-limit: 5

  - package-ecosystem: "terraform"
    directory: "/cloud/azure"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(tf-deps)"
    open-pull-requests-limit: 5

  - package-ecosystem: "terraform"
    directory: "/cloud/aws"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(tf-deps)"
    open-pull-requests-limit: 5

  - package-ecosystem: "terraform"
    directory: "/cloud/gcp"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(tf-deps)"
    open-pull-requests-limit: 5

  # Docker Compose Services
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker-deps)"
    open-pull-requests-limit: 5
