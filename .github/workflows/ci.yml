name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 3 * * 0' # Weekly Sunday at 03:00 UTC
  workflow_dispatch:
    inputs:
      run_chaos:
        description: 'Run chaos engineering tests'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  secrets-audit:
    name: Secrets Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: TruffleHog Git Scanner
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
        continue-on-error: true

  lint:
    name: Code Quality & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python Linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy yamllint shellcheck-py pydantic fastapi httpx pytest pytest-asyncio pyyaml
          pip install -e elo/packages/elo-contracts -e elo/packages/elo-security -e elo/packages/elo-ai-client -e elo/apps/elo-core

      - name: Ruff Lint & Format
        run: |
          ruff check elo/ || true
          ruff format --check elo/ || true

      - name: MyPy Type Check
        run: |
          mypy --ignore-missing-imports elo/packages/elo-contracts/src elo/packages/elo-security/src elo/packages/elo-ai-client/src elo/apps/elo-core/src || true

      - name: ShellCheck
        run: |
          find scripts ai elo cyber -name "*.sh" -exec shellcheck -e SC1091 -e SC2086 {} + || true

      - name: YAML Lint
        run: |
          yamllint -d "{extends: default, rules: {line-length: {max: 300}, document-start: disable, truthy: disable}}" . || true

      - name: Markdown Lint
        run: |
          npx markdownlint-cli "**/*.md" --ignore node_modules --ignore web/dist || true

      - name: Commit Lint
        uses: wagoid/commitlint-github-action@v6
        continue-on-error: true

  hadolint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Hadolint
        run: |
          if ! command -v hadolint &> /dev/null; then
            for i in 1 2 3; do
              sudo curl -fSL --connect-timeout 10 --retry 3 -o /usr/local/bin/hadolint "https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64" && sudo chmod +x /usr/local/bin/hadolint && break || sleep 2
            done
          fi
          find . -name "*Dockerfile*" -not -path "./web/node_modules/*" | while read -r df; do
            echo "Linting $df..."
            if command -v hadolint &> /dev/null; then
              hadolint --ignore DL3008 --ignore DL3013 --ignore DL3018 "$df" || true
            elif command -v docker &> /dev/null; then
              docker run --rm -i hadolint/hadolint hadolint --ignore DL3008 --ignore DL3013 --ignore DL3018 - < "$df" || true
            else
              echo "Skipping $df (hadolint not installed)"
            fi
          done

  security-scan:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bandit Scan
        run: |
          pip install bandit
          bandit -r elo/packages elo/apps/elo-core/src -ll -i || true

      - name: Semgrep Scan
        run: |
          pip install semgrep
          semgrep scan --config auto elo/ || true

      - name: Trivy Repository Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
        continue-on-error: true

      - name: Trivy IaC Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: './terraform'
          format: 'table'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Checkov IaC Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          soft_fail: true

  iac-validate:
    name: IaC Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Check Terraform Formatting
        run: |
          terraform fmt -check -recursive terraform/
          terraform fmt -check -recursive cloud/

      - name: Validate Terraform Modules
        run: |
          for dir in terraform terraform/modules/proxmox_lxc terraform/modules/proxmox_vm terraform/proxmox cloud/azure cloud/gcp cloud/aws; do
            if [ -d "$dir" ]; then
              echo "Validating $dir..."
              (cd "$dir" && terraform init -backend=false && terraform validate) || true
            fi
          done

      - name: Set up Python 3.12 for Ansible
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Ansible Playbooks
        run: |
          pip install ansible ansible-lint
          ansible-galaxy collection install community.general || true
          if [ -d "ansible" ]; then
            ansible-lint ansible/ || true
          fi
          if [ -d ansible/playbooks ]; then
            for pb in ansible/playbooks/*.yml; do
              [ -f "$pb" ] && ansible-playbook --syntax-check "$pb" || true
            done
          fi
          if [ -f ai/ansible/playbook.yml ]; then
            ansible-playbook --syntax-check ai/ansible/playbook.yml || true
          fi

      - name: Validate Docker Compose
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose config -q || true
          fi
          find services cyber -name "docker-compose*.yml" -o -name "compose*.yaml" | while read -r comp; do
            echo "Validating $comp..."
            docker compose -f "$comp" config -q || true
          done

      - name: Test Nginx Configurations
        run: |
          docker run --rm -v "${PWD}:/workspace" -w /workspace nginx:alpine sh -c "
            find . -name '*.conf' -path '*/nginx/*' -exec nginx -t -c {} \; 2>/dev/null || true
          "

      - name: Validate Kubernetes Manifests
        run: |
          for i in 1 2 3; do
            curl -fSL --connect-timeout 10 --retry 3 https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz && sudo mv kubeconform /usr/local/bin/ && break || sleep 2
          done
          if [ -d kubernetes ] && command -v kubeconform &> /dev/null; then
            find kubernetes -type f \( -name "*.yaml" -o -name "*.yml" \) -exec kubeconform -summary -ignore-missing-schemas {} + || true
          fi

      - name: Policy Validation (Conftest / OPA)
        run: |
          CONFTEST_VER="0.56.0"
          for i in 1 2 3; do
            curl -fSL --connect-timeout 10 --retry 3 "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VER}/conftest_${CONFTEST_VER}_Linux_x86_64.tar.gz" | tar xz && sudo mv conftest /usr/local/bin/ && break || sleep 2
          done
          if command -v conftest &> /dev/null; then
            if [ -d kubernetes ]; then
              conftest test -p policy/kubernetes/ $(find kubernetes -type f \( -name "*.yaml" -o -name "*.yml" \)) || true
            fi
            if [ -d policy/terraform ]; then
              conftest test -p policy/terraform/ terraform/ || true
            fi
          fi

      - name: Validate Renovate Config
        run: |
          docker run --rm -v "${PWD}:/usr/src/app" -w /usr/src/app renovate/renovate:latest renovate-config-validator || true

      - name: Render Terraform Docs
        uses: terraform-docs/gh-actions@v1.4.1
        with:
          working-dir: terraform/modules/proxmox_lxc,terraform/modules/proxmox_vm,terraform/proxmox
          output-file: README.md
          output-method: replace
          fail-on-diff: false

  python-matrix:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pytest pytest-asyncio httpx pydantic cryptography psutil uvicorn fastapi pyyaml python-dotenv
          pip install -e elo/packages/elo-contracts
          pip install -e elo/packages/elo-security
          pip install -e elo/packages/elo-ai-client
          pip install -e elo/apps/elo-core

      - name: Run Pytest
        run: |
          cd elo
          PYTHONPATH="apps/elo-core/src:packages/elo-contracts/src:packages/elo-security/src:packages/elo-ai-client/src" python -m pytest -v -o asyncio_mode=auto

  linux-matrix:
    name: Linux (${{ matrix.distro.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - name: 'Debian 12 Bookworm'
            image: 'debian:12-slim'
          - name: 'Ubuntu 24.04 LTS'
            image: 'ubuntu:24.04'
          - name: 'Alpine Linux 3.20'
            image: 'alpine:3.20'
          - name: 'Rocky Linux 9'
            image: 'rockylinux:9'
          - name: 'Fedora 40'
            image: 'fedora:40'
          - name: 'Arch Linux'
            image: 'archlinux:latest'
    container:
      image: ${{ matrix.distro.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Tests
        run: sh scripts/test_distro_compatibility.sh

  web-build:
    name: Web Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: |
          cd web
          npm ci || npm install

      - name: Build Web App
        run: |
          cd web
          npm run build

      - name: Validate Output
        run: |
          test -f web/dist/index.html
          echo "Frontend build completed."

  chaos-tests:
    name: Chaos Tests
    if: github.event_name == 'schedule' || github.event.inputs.run_chaos == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq stress-ng iproute2 curl jq
          chmod +x scripts/chaos/chaos_runner.sh

      - name: Start Staging Container
        run: |
          echo "Starting staging container..."
          docker run -d --name staging-microservice --restart=always -p 8088:80 nginx:alpine
          sleep 3
          curl -fsS http://localhost:8088 > /dev/null
          echo "Staging container ready."

      - name: CPU & Memory Stress Test
        run: |
          bash scripts/chaos/chaos_runner.sh cpu-stress 10
          bash scripts/chaos/chaos_runner.sh ram-pressure 10

      - name: Service Fault & Recovery Test
        run: |
          bash scripts/chaos/chaos_runner.sh service-kill 5 staging-microservice
          bash scripts/chaos/chaos_runner.sh auto-healing-check 30 staging-microservice
          docker ps --filter "name=staging-microservice"

      - name: Network Degradation Test
        run: |
          bash scripts/chaos/chaos_runner.sh network-latency 5 lo 50ms || true
          bash scripts/chaos/chaos_runner.sh packet-loss 5 lo 10% || true

      - name: Alert Webhooks Test
        env:
          UPTIME_KUMA_URL: ${{ secrets.UPTIME_KUMA_PUSH_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          bash scripts/chaos/chaos_runner.sh alert-webhook-validate

      - name: Cleanup
        if: always()
        run: |
          docker rm -f staging-microservice 2>/dev/null || true
          echo "Staging environment cleaned up."

  ci-summary:
    name: CI Summary
    needs:
      - secrets-audit
      - lint
      - hadolint
      - security-scan
      - iac-validate
      - python-matrix
      - linux-matrix
      - web-build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Status Check
        run: |
          echo "CI checks completed."
