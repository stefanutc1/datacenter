name: CI Validation Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-yaml:
    name: Lint YAML & Ansible Infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install yamllint ansible-lint ansible
          fi

      - name: Run YAML Lint
        run: |
          if [ -f .yamllint ]; then
            yamllint -c .yamllint . || true
          else
            yamllint . || true
          fi

      - name: Run Ansible Lint
        run: |
          ansible-galaxy collection install community.general || true
          if [ -d ansible ]; then
            ansible-lint ansible/ || true
          fi
          if [ -d cyber/ansible ]; then
            ansible-lint cyber/ansible/ || true
          fi

  build-frontend:
    name: Build & Validate Web & Custom Apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            homepage/package-lock.json
            custom-apps/package-lock.json

      - name: Install Dependencies
        run: |
          cd web && npm install
          if [ -d "../homepage" ] && [ -f "../homepage/package.json" ]; then
            cd ../homepage && npm install
          fi
          if [ -d "../custom-apps" ] && [ -f "../custom-apps/package.json" ]; then
            cd ../custom-apps && npm install
          fi

      - name: Build Unified Web Wiki & Dashboard
        run: |
          cd web
          GITHUB_PAGES=true NEXT_PUBLIC_BASE_PATH=/homelab/ npm run build

      - name: Build Standalone Custom Applications Suite
        if: hashFiles('custom-apps/package.json') != ''
        run: |
          cd custom-apps
          npm run build

      - name: Verify Distribution Artifacts
        run: |
          test -f web/dist/index.html || { echo "Missing web/dist/index.html"; exit 1; }
          test -f web/dist/.nojekyll || { echo "Missing web/dist/.nojekyll"; exit 1; }
          echo "✅ All frontend builds verified successfully!"

  terraform-validate:
    name: Validate Terraform Configurations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate Core Homelab Terraform
        if: hashFiles('terraform/*.tf') != ''
        run: |
          cd terraform
          terraform fmt -check || true
          terraform init -backend=false
          terraform validate

      - name: Validate Cyber Proving Ground Terraform
        if: hashFiles('cyber/terraform/*.tf') != ''
        run: |
          cd cyber/terraform
          terraform fmt -check || true
          terraform init -backend=false
          terraform validate

  elo-test:
    name: Test ELO AI Operating Layer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ELO Packages & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx pydantic psutil uvicorn fastapi pyyaml
          pip install -e elo/packages/elo-contracts
          pip install -e elo/packages/elo-security
          pip install -e elo/packages/elo-ai-client
          pip install -e elo/apps/elo-core

      - name: Run ELO Automated Test Suite
        run: |
          cd elo
          pytest -v

