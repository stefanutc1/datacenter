name: CI Validation Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-yaml:
    name: Lint YAML & Inventory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install yamllint ansible-lint ansible

      - name: Run YAML Lint
        run: yamllint -c .yamllint . || true

      - name: Run Ansible Lint
        run: |
          ansible-galaxy collection install community.general || true
          ansible-lint ansible/ || true

  build-frontend:
    name: Build & Test Frontend (Vue.js & Wiki)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            homepage/package-lock.json

      - name: Install Web Dependencies
        run: |
          cd web
          npm install

      - name: Install Homepage Dependencies
        if: hashFiles('homepage/package.json') != ''
        run: |
          cd homepage
          npm install

      - name: Build Unified Web Wiki & Homepage
        run: |
          cd web
          GITHUB_PAGES=true NEXT_PUBLIC_BASE_PATH=/homelab/ npm run build

      - name: Verify Distribution Artifacts
        run: |
          test -f web/dist/index.html || { echo "Missing index.html"; exit 1; }
          test -f web/dist/.nojekyll || { echo "Missing .nojekyll"; exit 1; }
          echo "✅ Frontend build validation succeeded!"

  terraform-validate:
    name: Validate Terraform Infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format & Validate
        run: |
          cd terraform
          terraform fmt -check || true
          terraform init -backend=false
          terraform validate
