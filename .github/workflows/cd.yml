name: Enterprise CD Deployment & Multi-Arch Container Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ==========================================
  # STAGE 1: WEB FRONTEND GITHUB PAGES DEPLOY
  # ==========================================
  build-and-deploy-frontend:
    name: 🌐 Build & Deploy Frontend to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd web
          npm ci || npm install

      - name: Build Production Frontend Bundle
        run: |
          cd web
          GITHUB_PAGES=true DEPLOY_TARGET=gh-pages NEXT_PUBLIC_BASE_PATH=/${{ github.event.repository.name }}/ npm run build
          touch dist/.nojekyll
          cp dist/index.html dist/404.html 2>/dev/null || true

      - name: Setup GitHub Pages Config
        uses: actions/configure-pages@v6
        continue-on-error: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
        continue-on-error: true

      - name: Deploy to GitHub Pages Environment
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Deploy Static Build to gh-pages Branch (Dual-Mode Resilient Fallback)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy(pages): automatic production build [skip ci]"

  # ==========================================
  # STAGE 2: MULTI-ARCH DOCKER CONTAINER RELEASE (GHCR)
  # ==========================================
  publish-multiarch-containers:
    name: 🐳 Publish Multi-Arch Containers to GHCR (AMD64 & ARM64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: 'homelab-web'
            context: '.'
            dockerfile: 'web/Dockerfile'
          - name: 'elo-core'
            context: 'elo'
            dockerfile: 'elo/apps/elo-core/Dockerfile'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for Multi-Arch Emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Image Metadata
        id: meta
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${REPO_OWNER}/${{ matrix.target.name }}"
          echo "image=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build & Push Multi-Arch Image (linux/amd64, linux/arm64)
        if: hashFiles(matrix.target.dockerfile) != ''
        uses: docker/build-push-action@v5
        continue-on-error: true
        with:
          context: ${{ matrix.target.context }}
          file: ${{ matrix.target.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
