name: CD

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      run_deploy:
        description: 'Run deployment jobs'
        required: false
        default: true
        type: boolean
      run_automerge:
        description: 'Run Dependabot PR auto-merge'
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '0 2,3 * * *' # Daily at 05:00 AM Europe/Bucharest (02:00 UTC EEST / 03:00 UTC EET)

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write
  pull-requests: write

jobs:
  merge-dependabot:
    name: Merge Dependabot PRs
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_automerge != false)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Auto-Merge Dependabot Pull Requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUCHAREST_TIME=$(TZ="Europe/Bucharest" date '+%Y-%m-%d %H:%M:%S %Z')
          BUCHAREST_HOUR=$(TZ="Europe/Bucharest" date +%H)
          echo "Current time in Europe/Bucharest: ${BUCHAREST_TIME} (hour: ${BUCHAREST_HOUR})"

          if [ "${{ github.event_name }}" = "schedule" ] && [ "$BUCHAREST_HOUR" != "05" ]; then
            echo "Skipping run: scheduled trigger received at hour ${BUCHAREST_HOUR}, waiting for 05:00 Europe/Bucharest."
            exit 0
          fi

          echo "Querying open Dependabot pull requests..."
          OPEN_PRS=$(gh pr list --state open --json number,title,author --jq '.[] | select(.author.login == "dependabot[bot]" or .author.login == "app/dependabot") | .number')

          if [ -z "$OPEN_PRS" ]; then
            echo "No open pull requests from Dependabot found."
            exit 0
          fi

          echo "Open Dependabot pull requests to merge: $OPEN_PRS"
          for PR in $OPEN_PRS; do
            echo "=========================================="
            echo "Processing Dependabot PR #${PR}..."

            # Submit approval if possible
            gh pr review "${PR}" --approve || echo "Review submission skipped or already approved for PR #${PR}."

            # Merge PR
            if gh pr merge "${PR}" --merge --delete-branch; then
              echo "PR #${PR} merged successfully using merge commit."
            elif gh pr merge "${PR}" --squash --delete-branch; then
              echo "PR #${PR} merged successfully using squash."
            elif gh api -X PUT "repos/${{ github.repository }}/pulls/${PR}/merge" -f merge_method=merge; then
              echo "PR #${PR} merged via GitHub API."
            else
              echo "Warning: Unable to automatically merge PR #${PR}."
            fi

            sleep 3
          done
          echo "Finished processing Dependabot pull requests."

  build-and-deploy-web:
    name: Build & Deploy Web
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_deploy != false)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: |
          cd web
          npm ci || npm install --legacy-peer-deps

      - name: Build Frontend
        env:
          GITHUB_PAGES: 'true'
        run: |
          cd web
          npm run build
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/dist
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy-pages-environment:
    name: Deploy to GitHub Pages
    needs: build-and-deploy-web
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  publish-containers:
    name: Publish Containers
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_deploy != false)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: 'datacenter'
            context: '.'
            dockerfile: 'web/Dockerfile'
          - name: 'elo'
            context: 'elo'
            dockerfile: 'elo/apps/elo-core/Dockerfile'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Image Metadata
        id: meta
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${REPO_OWNER}/${{ matrix.target.name }}"
          echo "image=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build & Push Image
        if: hashFiles(matrix.target.dockerfile) != ''
        uses: docker/build-push-action@v7
        continue-on-error: true
        with:
          context: ${{ matrix.target.context }}
          file: ${{ matrix.target.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sync-readme:
    name: Sync README
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_deploy != false)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run Sync Script
        run: |
          python3 scripts/sync_readme_metrics.py

      - name: Commit & Push
        run: |
          if [ -n "$(git status --porcelain README.md)" ]; then
            git config --local user.email "action@github.com"
            git config --local user.name "github-actions[bot]"
            git add README.md
            git commit -m "docs(readme): update metrics [skip ci]"
            git push
            echo "README.md updated."
          else
            echo "No changes detected in README.md."
          fi
