name: CD Deployment & Container Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ==========================================
  # STAGE 1: WEB FRONTEND BUILD
  # ==========================================
  build-and-verify-frontend:
    name: Build Frontend (Angular 20 Enterprise App)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd web
          npm ci || npm install

      - name: Build Production Frontend Bundle (Angular Build)
        run: |
          cd web
          npm run build
          test -f dist/index.html
          echo "Angular frontend bundle verified successfully."

  # ==========================================
  # STAGE 2: MULTI-ARCH CONTAINER RELEASE
  # ==========================================
  publish-multiarch-containers:
    name: Publish Containers to GHCR (AMD64 & ARM64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: 'datacenter'
            context: '.'
            dockerfile: 'web/Dockerfile'
          - name: 'elo'
            context: 'elo'
            dockerfile: 'elo/apps/elo-core/Dockerfile'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Image Metadata
        id: meta
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${REPO_OWNER}/${{ matrix.target.name }}"
          echo "image=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build & Push Multi-Arch Image (linux/amd64, linux/arm64)
        if: hashFiles(matrix.target.dockerfile) != ''
        uses: docker/build-push-action@v5
        continue-on-error: true
        with:
          context: ${{ matrix.target.context }}
          file: ${{ matrix.target.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
