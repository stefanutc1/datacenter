name: CD Deployment Pipeline

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            homepage/package-lock.json
            custom-apps/package-lock.json

      - name: Install Web Dependencies
        run: |
          cd web && npm install
          if [ -d "../homepage" ] && [ -f "../homepage/package.json" ]; then
            cd ../homepage && npm install
          fi
          if [ -d "../custom-apps" ] && [ -f "../custom-apps/package.json" ]; then
            cd ../custom-apps && npm install
          fi

      - name: Build Unified Distribution Bundle
        run: |
          cd web
          GITHUB_PAGES=true DEPLOY_TARGET=gh-pages NEXT_PUBLIC_BASE_PATH=/${{ github.event.repository.name }}/ npm run build
          mkdir -p dist
          touch dist/.nojekyll
          cp dist/index.html dist/404.html 2>/dev/null || true

      - name: Setup GitHub Pages Config
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload Pages Artifact (for Actions Pages mode)
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
        continue-on-error: true

      - name: Deploy to GitHub Pages Environment
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Deploy Static Build to gh-pages Branch (Dual-Mode Fallback)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy(pages): automatic production build [skip ci]"

  docker-publish:
    name: Build & Push Web Docker Image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Image Metadata
        id: meta
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${REPO_OWNER}/homelab-web"
          echo "image=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        continue-on-error: true
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
