name: macOS Desktop App Build & DMG Release

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
    paths:
      - 'elo/apps/elo-desktop-macos/**'
      - 'elo/packages/**'
      - '.github/workflows/desktop-macos-release.yml'
  workflow_dispatch:

jobs:
  build-macos-dmg:
    name: Build & Package ELO macOS Desktop App (.dmg)
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and Package ELO DMG Image
        run: |
          cd elo/apps/elo-desktop-macos
          chmod +x build_dmg.sh
          ./build_dmg.sh

      - name: Upload DMG Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ELO-macOS-arm64-dmg
          path: elo/apps/elo-desktop-macos/dist/ELO-macOS-arm64.dmg
          retention-days: 30

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: elo/apps/elo-desktop-macos/dist/ELO-macOS-arm64.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
