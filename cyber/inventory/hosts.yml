---
# ==============================================================================
# Enterprise CyberLab — Ansible Inventory Manifest
# ==============================================================================

all:
  children:
    controllers:
      hosts:
        cyber-ctrl:
          ansible_host: 192.168.64.2
          ansible_user: cyberadmin
          ansible_connection: local

    hardened_nodes:
      hosts:
        cyber-node01:
          ansible_host: 192.168.64.10
          ansible_user: cyberadmin
          ansible_port: 2222
          node_role: target-primary
          security_profile: strict
        cyber-node02:
          ansible_host: 192.168.64.20
          ansible_user: cyberadmin
          ansible_port: 2222
          node_role: dmz-service
          security_profile: standard

    soc_services:
      hosts:
        cyber-soc01:
          ansible_host: 192.168.64.30
          ansible_user: cyberadmin
          ansible_port: 22
          node_role: siem-soc-stack

  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
