version: '3.8'

# ==============================================================================
# T-POT MULTI-HONEYPOT DECEPTION CLUSTER (VLAN 40 DMZ)
# ==============================================================================

services:
  # Cowrie: SSH & Telnet Medium/High Interaction Honeypot
  cowrie:
    image: cowrie/cowrie:latest
    container_name: cowrie-honeypot
    restart: always
    ports:
      - "2222:2222"
      - "2223:2223"
    environment:
      - COWRIE_TELNET_ENABLED=yes
      - COWRIE_JSON_LOG=yes
    volumes:
      - ./data/cowrie/log:/cowrie/var/log/cowrie
      - ./data/cowrie/tty:/cowrie/var/lib/cowrie/tty
      - ./data/cowrie/downloads:/cowrie/var/lib/cowrie/downloads

  # Dionaea: Malware Capture Honeypot (SMB, HTTP, FTP, TFTP, MSSQL, MySQL)
  dionaea:
    image: dinotools/dionaea:latest
    container_name: dionaea-honeypot
    restart: always
    ports:
      - "21:21"
      - "445:445"
      - "1433:1433"
      - "3306:3306"
    volumes:
      - ./data/dionaea/binaries:/opt/dionaea/var/dionaea/binaries
      - ./data/dionaea/log:/opt/dionaea/var/dionaea/log

  # Honeytrap: Network protocol deception agent
  honeytrap:
    image: honeytrap/honeytrap:latest
    container_name: honeytrap-agent
    restart: always
    network_mode: host
    volumes:
      - ./config/honeytrap.toml:/config/config-default.toml:ro
      - ./data/honeytrap:/data

  # Threat Log Shipper to Wazuh SIEM & AbuseIPDB
  threat-forwarder:
    build:
      context: ./forwarder
    container_name: threat-forwarder
    restart: always
    environment:
      - WAZUH_MANAGER_IP=192.168.30.10
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY}
    volumes:
      - ./data/cowrie/log:/var/log/cowrie:ro
      - ./data/dionaea/log:/var/log/dionaea:ro
