name: CD Deployment Pipeline

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-pages:
    name: Deploy Web Hub to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Vue.js Web Hub for GitHub Pages
        run: |
          cd web
          GITHUB_PAGES=true DEPLOY_TARGET=gh-pages NEXT_PUBLIC_BASE_PATH=/${{ github.event.repository.name }}/ npm install
          GITHUB_PAGES=true DEPLOY_TARGET=gh-pages NEXT_PUBLIC_BASE_PATH=/${{ github.event.repository.name }}/ npm run build
          mkdir -p dist
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  docker-publish:
    name: Build & Push Web Docker Image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository owner to lowercase for Docker tag
        id: repo_owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: web/Dockerfile
          push: false
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/revolut-vishing-forensics-web:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/revolut-vishing-forensics-web:${{ github.sha }}
