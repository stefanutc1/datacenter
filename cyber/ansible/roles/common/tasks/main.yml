---
# Tasks for Common Baseline Configuration

- name: Update apt cache and upgrade system packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install baseline system packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Set timezone to {{ timezone }}
  community.general.timezone:
    name: "{{ timezone }}"

- name: Apply sysctl kernel security hardening
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: true
  loop: "{{ sysctl_settings | default({}) | dict2items }}"
  when: common_manage_sysctl

- name: Ensure unattended-upgrades is enabled
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: '0644'
