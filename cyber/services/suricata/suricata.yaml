%YAML 1.1
---
default-log-dir: /var/log/suricata

stats:
  enabled: true
  interval: 10sec

outputs:
  - fast:
      enabled: true
      filename: fast.log
      append: true

  - eve-log:
      enabled: true
      filetype: regular
      filename: eve.json
      types:
        - alert:
            payload: true
            packet: true
            metadata: true
            http-body: true
        - http:
            extended: true
        - dns:
            query: true
            answer: true
        - tls:
            extended: true
        - files:
            force-magic: true
        - drop:
            alerts: true
        - flow

af-packet:
  - interface: default
    threads: auto
    cluster-id: 99
    cluster-type: cluster_flow
    defrag: true
