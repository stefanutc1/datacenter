---
services:
  wazuh-manager:
    image: wazuh/wazuh-manager:4.8.0
    container_name: wazuh-manager
    restart: unless-stopped
    ports:
      - "1514:1514/udp"
      - "1515:1515"
      - "514:514/udp"
      - "55000:55000"
    volumes:
      - ./config/wazuh-manager.conf:/var/ossec/etc/ossec.conf:ro
      - ./data/api:/var/ossec/api/configuration
      - ./data/etc:/var/ossec/etc
      - ./data/logs:/var/ossec/logs
      - ./data/queue:/var/ossec/queue

  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.8.0
    container_name: wazuh-dashboard
    restart: unless-stopped
    ports:
      - "8443:5601"
    environment:
      - WAZUH_INDEXER_URL=https://wazuh-indexer:9200
    depends_on:
      - wazuh-manager
